<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PDF Export</title>
  <link rel="stylesheet" href="libs/katex.min.css">
  <!-- Light code theme (default) -->
  <link id="codeThemeLight" rel="stylesheet" href="libs/github.min.css">
  <!-- Dark code theme (disabled by default) -->
  <link id="codeThemeDark" rel="stylesheet" href="libs/atom-one-dark.min.css" disabled>
  <style>
    :root {
      --main-font: 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--main-font);
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      color: #1a1a1a;
      line-height: 1.6;
      background: white;
    }
    h1, h2, h3, h4, h5, h6 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
      line-height: 1.3;
    }
    h1 { font-size: 2em; border-bottom: 2px solid #eaecef; padding-bottom: 0.3em; }
    h2 { font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.2em; }
    p { margin-bottom: 1em; }
    pre {
      background: #f6f8fa;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin: 1em 0;
    }
    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9em;
    }
    blockquote {
      border-left: 4px solid #ddd;
      margin: 1em 0;
      padding: 0.5em 1em;
      color: #555;
      background: #fafafa;
    }
    table {
      border-collapse: collapse;
      margin: 1em 0;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #f5f5f5;
      font-weight: 600;
    }
    .mermaid svg {
      max-width: 100%;
      height: auto;
    }
    /* Page break utility */
    .page-break-before {
      page-break-before: always;
    }
    /* Dark code theme overrides */
    body.code-dark pre {
      background: #1e1e1e;
      color: #d4d4d4;
    }
    body.code-dark code {
      color: #d4d4d4;
    }
    @media print {
      body { margin: 0; padding: 0; }
      @page { margin: 2cm; }
    }
    /* Font classes */
    body.font-inter { font-family: 'Inter', sans-serif; }
    body.font-roboto { font-family: 'Roboto', sans-serif; }
    body.font-opensans { font-family: 'Open Sans', sans-serif; }
    body.font-times { font-family: 'Times New Roman', serif; }
    body.font-georgia { font-family: Georgia, serif; }
    body.font-garamond { font-family: Garamond, serif; }
    body.font-jetbrains { font-family: 'JetBrains Mono', monospace; }
    body.font-firacode { font-family: 'Fira Code', monospace; }
    body.font-consolas { font-family: Consolas, monospace; }
    body.font-sfpro { font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="content"></div>
  <script src="libs/marked.min.js"></script>
  <script src="libs/katex.min.js"></script>
  <script src="libs/mermaid.min.js"></script>
  <script src="libs/highlight.min.js"></script>
  <script src="print-page.js"></script>
</body>
</html>
